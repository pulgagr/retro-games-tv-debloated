<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; background: #12121c; color: #eee; font-family: sans-serif; }
  h1 { margin: 0; padding: 24px 40px 8px; font-size: 28px; color: #ffc107; }
  /* Game shelf: a big hero for the selected game over one row of covers. The row is a fixed set of
     slots whose contents shift, so the page stays small however many games a console has. */
  #shelf { position: fixed; left: 0; top: 0; width: 100vw; height: 100vh; overflow: hidden; }
  #sglow { position: absolute; left: 0; top: 0; width: 100%; height: 100%; opacity: .45; }
  #hero { position: absolute; left: 6vw; right: 6vw; top: 7vh; height: 46vh; display: flex; gap: 3.5vw; }
  #hart { position: relative; width: 46vh; height: 46vh; flex: none; border-radius: 1.2vw; overflow: hidden;
          background: #2a2a3c; }
  #hart img, #hph { width: 100%; height: 100%; object-fit: cover; display: block; }
  #hph { display: flex; align-items: center; justify-content: center; padding: 8%; text-align: center;
         font: bold 3vw sans-serif; color: #ccc; }
  .scan { position: absolute; left: 0; top: 0; width: 100%; height: 100%;
          background: repeating-linear-gradient(rgba(0,0,0,.16) 0 1px, transparent 1px 3px); }
  .in { animation: slidein .18s ease-out; }
  @keyframes slidein { from { transform: translateY(1.2vh); opacity: .3; } to { transform: none; opacity: 1; } }
  #hinfo { display: flex; flex-direction: column; justify-content: center; min-width: 0; }
  #hcon { font-size: 1.7vw; color: rgba(255,255,255,.55); letter-spacing: .1vw; }
  #htitle { font-size: 4vw; font-weight: bold; line-height: 1.15; margin: .8vh 0 1.4vh; overflow: hidden;
            display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
  #hmeta { font-size: 1.8vw; color: rgba(255,255,255,.7); }
  #hcont { font-size: 1.8vw; color: #ffc107; margin-top: 1.4vh; }
  #hints { font-size: 1.5vw; color: rgba(255,255,255,.6); margin-top: 3vh; }
  .k { display: inline-block; min-width: 2.2vw; padding: 0 .5vw; margin: 0 .5vw 0 1.6vw; border-radius: .5vw;
       background: rgba(255,255,255,.14); color: #fff; text-align: center; }
  .k:first-child { margin-left: 0; }
  #rowname { position: absolute; left: 6vw; top: 60vh; font-size: 1.8vw; color: rgba(255,255,255,.75); }
  #strip { position: absolute; left: 6vw; top: 66vh; display: flex; gap: 1.6vw; }
  .slot { position: relative; width: 11vw; height: 11vw; flex: none; border-radius: .8vw; background: #2a2a3c;
          overflow: hidden; outline: .35vw solid transparent; transition: transform .12s; }
  .slot img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .slot .ph { padding: 6%; font: bold 1.3vw sans-serif; color: #ccc; }
  .slot.on { transform: scale(1.22); outline-color: #ffc107; z-index: 1; }
  .slot .dot { position: absolute; top: .5vw; right: .5vw; width: 1.1vw; height: 1.1vw; border-radius: 50%;
               background: #ffc107; }
  #nextrow { position: absolute; left: 6vw; bottom: 3.5vh; font-size: 1.5vw; color: rgba(255,255,255,.45); }
  /* Console carousel: the selected console big in the middle, neighbours smaller at the sides */
  #consoles { position: fixed; left: 0; top: 0; width: 100vw; height: 100vh; overflow: hidden; }
  #consoles h1 { position: relative; z-index: 2; }
  #glow { position: absolute; left: 0; top: 0; width: 100%; height: 100%; opacity: .5; transition: opacity .3s; }
  .slide { position: absolute; left: 50%; top: 45%; width: 44vw; height: 50vh; margin-left: -22vw;
           transition: transform .35s ease-out, opacity .35s; }
  /* photos have different shapes (the Game Boy is tall): fit each inside the same box */
  .slide img { display: block; width: 100%; height: 100%; object-fit: contain;
               filter: drop-shadow(0 1.5vw 1.5vw rgba(0,0,0,.6)); }
  .slide .ph { height: 100%; display: flex; align-items: center; justify-content: center; border-radius: 2vw;
               font: bold 4vw sans-serif; }
  #caption { position: absolute; left: 0; right: 0; bottom: 9vh; text-align: center; z-index: 2; }
  #cname { font-size: 5.2vw; font-weight: bold; }
  #ccount { margin-top: .6vw; font-size: 2vw; color: rgba(255,255,255,.65); }
  #dots { margin-top: 1.6vw; }
  #dots i { display: inline-block; width: .9vw; height: .9vw; margin: 0 .5vw; border-radius: 50%;
            background: rgba(255,255,255,.3); }
  #dots i.on { background: #ffc107; }
  .hide { display: none !important; }
</style>
</head>
<body>
<div id="consoles">
  <div id="glow"></div>
  <h1>Retro Games</h1>
  <div id="caption"><div id="cname"></div><div id="ccount"></div><div id="dots"></div></div>
</div>
<div id="shelf" class="hide">
  <div id="sglow"></div>
  <div id="hero">
    <div id="hart"><img id="himg"><div id="hph"></div><div class="scan"></div></div>
    <div id="hinfo">
      <div id="hcon"></div><div id="htitle"></div><div id="hmeta"></div><div id="hcont"></div>
      <div id="hints"><span class="k">A</span>Play<span class="k">Y</span>Favorite<span class="k">X</span>Surprise me<span class="k">L R</span>Letters</div>
    </div>
  </div>
  <div id="rowname"></div>
  <div id="strip"></div>
  <div id="nextrow"></div>
</div>
<script src="games.js"></script>
<script>
  var SLOTS = 9;   // covers on screen; the selected one sits in the second slot
  var consolesEl = document.getElementById('consoles'), shelf = document.getElementById('shelf');
  var strip = document.getElementById('strip'), games = [], current = null, saved = {};
  var rows = [], row = 0, pos = {}, favs = {};
  var slides = [], sel = 0;

  function store(k, v) { try { localStorage.setItem(k, v); } catch (e) {} }
  function load(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }

  try { favs = JSON.parse(load('favs')) || {}; } catch (e) {}
  function key(g) { return g[0] + '/' + g[3]; }

  // Games with a resume point, from the app (missing when the page is opened in a browser)
  function refreshSaved() {
    saved = {};
    try { Android.saved().split('\n').forEach(function (k) { if (k) saved[k] = 1; }); } catch (e) {}
    if (current) buildRows();
  }

  for (var s = 0; s < SLOTS; s++) {
    var el = document.createElement('div');
    el.className = 'slot';
    el.innerHTML = '<img><div class="ph"></div><div class="dot"></div>';
    strip.appendChild(el);
  }

  CONSOLES.forEach(function (c) {
    c.count = GAMES.filter(function (g) { return g[0] === c.id; }).length;
    var el = document.createElement('div');
    el.className = 'slide';
    if (c.art) el.innerHTML = '<img src="consoles/' + c.id + '.webp">';
    else {
      el.innerHTML = '<div class="ph"></div>';
      el.firstChild.textContent = c.name;
      el.firstChild.style.background = c.color;
    }
    el.offset = 0;
    consolesEl.appendChild(el);
    slides.push(el);
    document.getElementById('dots').appendChild(document.createElement('i'));
  });

  // Lays the carousel out around console `i` (wrapping around at both ends)
  function pick(i) {
    var n = CONSOLES.length;
    sel = (i % n + n) % n;
    slides.forEach(function (el, j) {
      var d = j - sel;
      if (d > n / 2) d -= n; else if (d < -n / 2) d += n;
      // A slide wrapping from one side to the other jumps instead of sliding across the screen
      var jump = Math.abs(d - el.offset) > 1.5;
      if (jump) el.style.transition = 'none';
      el.offset = d;
      var far = Math.abs(d);
      el.style.transform = 'translate(' + (d * 40) + 'vw, -50%) scale(' + (far ? 0.55 : 1) + ')';
      el.style.opacity = far === 0 ? 1 : far <= 1 ? 0.35 : 0;
      el.style.zIndex = far ? 0 : 1;
      if (jump) { el.offsetWidth; el.style.transition = ''; }
    });
    var c = CONSOLES[sel];
    document.getElementById('glow').style.background =
      'radial-gradient(ellipse 45% 55% at 50% 42%, ' + c.color + ', transparent)';
    document.getElementById('cname').textContent = c.name;
    document.getElementById('ccount').textContent = c.count + ' games';
    [].forEach.call(document.getElementById('dots').children, function (d, j) { d.className = j === sel ? 'on' : ''; });
    store('console', sel);
  }

  // The hash says which screen we're on: empty = console picker, otherwise a console's games.
  // Using the hash means Back goes from the games to the consoles.
  function show() {
    var id = location.hash.slice(1);
    current = CONSOLES.filter(function (c) { return c.id === id; })[0] || null;
    consolesEl.classList.toggle('hide', !!current);
    shelf.classList.toggle('hide', !current);
    if (!current) { pick(+load('console') || 0); return; }
    store('console', CONSOLES.indexOf(current));
    games = GAMES.filter(function (g) { return g[0] === current.id; });
    document.getElementById('sglow').style.background =
      'radial-gradient(ellipse 60% 70% at 20% 30%, ' + current.color + ', transparent)';
    document.getElementById('hcon').textContent = current.name;
    pos = {};
    try { pos = JSON.parse(load('pos-' + current.id)) || {}; } catch (e) {}
    buildRows();
  }

  // "Continue playing" and "Favorites" only appear when they have games
  function buildRows() {
    var name = rows[row] && rows[row].name;
    rows = [
      {name: 'Continue playing', items: games.filter(function (g) { return saved[key(g)]; })},
      {name: 'Favorites', items: games.filter(function (g) { return favs[key(g)]; })},
      {name: 'All games', items: games}
    ].filter(function (r) { return r.items.length; });
    row = 0;
    rows.forEach(function (r, i) { if (r.name === (name || load('row-' + current.id))) row = i; });
    draw();
  }

  function draw(animate) {
    var r = rows[row], p = Math.max(0, Math.min(r.items.length - 1, pos[r.name] || 0));
    pos[r.name] = p;
    [].forEach.call(strip.children, function (el, k) {
      var g = r.items[p - 1 + k];
      el.style.visibility = g ? 'visible' : 'hidden';
      el.className = 'slot' + (k === 1 ? ' on' : '');
      if (!g) return;
      var img = el.firstChild, ph = el.children[1];
      img.style.display = g[4] ? '' : 'none';
      ph.style.display = g[4] ? 'none' : '';
      if (g[4]) { var src = 'covers/' + g[0] + '/' + g[3] + '.webp'; if (img.getAttribute('src') !== src) img.src = src; }
      else ph.textContent = g[2];
      el.children[2].style.display = saved[key(g)] ? '' : 'none';
    });
    var g = r.items[p], himg = document.getElementById('himg'), hph = document.getElementById('hph');
    himg.style.display = g[4] ? '' : 'none';
    hph.style.display = g[4] ? 'none' : '';
    if (g[4]) himg.src = 'covers/' + g[0] + '/' + g[3] + '.webp'; else hph.textContent = g[2];
    document.getElementById('htitle').textContent = (favs[key(g)] ? '\u2605 ' : '') + g[2];
    document.getElementById('hmeta').textContent = g[6] || '';
    document.getElementById('hcont').textContent = saved[key(g)] ? '\u25B6 Continue where you left off' : '';
    var letter = r.name === 'All games' ? '  \u00B7  ' + initial(g) : '';
    document.getElementById('rowname').textContent = r.name + letter + '  \u00B7  ' + (p + 1) + ' / ' + r.items.length;
    var next = rows[row + 1] || rows[row - 1];
    document.getElementById('nextrow').textContent =
      next ? (rows[row + 1] ? '\u25BC ' : '\u25B2 ') + next.name : '';
    if (animate) {   // quick "cartridge slides in" when the hero changes
      var h = document.getElementById('hero');
      h.classList.remove('in'); h.offsetWidth; h.classList.add('in');
    }
    store('pos-' + current.id, JSON.stringify(pos));
    store('row-' + current.id, r.name);
  }

  function initial(g) {
    var c = g[2].replace(/^(the|a|an) /i, '').charAt(0).toUpperCase();
    return c >= 'A' && c <= 'Z' ? c : '#';
  }

  function move(d) {
    var r = rows[row];
    pos[r.name] = Math.max(0, Math.min(r.items.length - 1, (pos[r.name] || 0) + d));
    draw(true);
  }

  // Controller buttons the app passes in: y favorite, x surprise me, l/r previous/next letter
  function pad(b) {
    if (!current) return;
    var r = rows[row], g = r.items[pos[r.name] || 0];
    if (b === 'y') {
      if (favs[key(g)]) delete favs[key(g)]; else favs[key(g)] = 1;
      store('favs', JSON.stringify(favs));
      buildRows();
      return;
    }
    var all = rows.length - 1;   // "All games" is always the last row
    if (b === 'x') { row = all; pos['All games'] = Math.floor(Math.random() * games.length); draw(true); return; }
    if (b === 'l' || b === 'r') {
      if (row !== all) { row = all; }
      var list = rows[all].items, p = pos['All games'] || 0, here = initial(list[p]);
      if (b === 'r') { while (p < list.length - 1 && initial(list[p]) === here) p++; }
      else {
        while (p > 0 && initial(list[p]) === here) p--;          // back into the previous letter...
        var prev = initial(list[p]);
        while (p > 0 && initial(list[p - 1]) === prev) p--;      // ...and to its first game
      }
      pos['All games'] = p;
      draw(true);
    }
  }

  function play() {
    var r = rows[row], g = r.items[pos[r.name] || 0];
    // Arcade sets stay zipped ("raw") and bring the zips they need (parent set, BIOS) along
    var dir = SOURCE.dir + '/' + current.folder + '/';
    var deps = (g[5] || []).map(function (f) { return dir + f; }).join('|');   // 0 for consoles
    Android.play(current.core, SOURCE.host, SOURCE.share, dir + g[1], g[0] + '/' + g[3], g[2], !!current.raw, deps);
  }

  document.addEventListener('keydown', function (e) {
    if (!current) {   // console carousel: left/right to choose, OK to open
      if (e.keyCode === 37 || e.keyCode === 39) { pick(sel + (e.keyCode === 37 ? -1 : 1)); e.preventDefault(); }
      else if (e.keyCode === 13) { location.hash = CONSOLES[sel].id; e.preventDefault(); }
      return;
    }
    if (e.keyCode === 37 || e.keyCode === 39) move(e.keyCode === 37 ? -1 : 1);
    else if (e.keyCode === 38 && row > 0) { row--; draw(true); }
    else if (e.keyCode === 40 && row < rows.length - 1) { row++; draw(true); }
    else if (e.keyCode === 13) play();
    else return;
    e.preventDefault();
  });

  window.addEventListener('hashchange', show);
  show();
</script>
</body>
</html>
